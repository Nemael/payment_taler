when:
  - event: [push, pull_request]

steps:
  unit-tests:
    image: odoo:18
    pull: true
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      HOST: db
    commands:
      - echo "Starting Odoo unit tests..."
      - echo "Current directory:"
      - pwd
      - echo "Files in .:"
      - ls -l .
      - echo "Files in /woodpecker/src:"
      - ls -l /woodpecker/src
      - echo "Files in /woodpecker/:"
      - ls -l /woodpecker/
      - echo "Files in /:"
      - ls -l /
      - >
        odoo 
        -d test_db
        --db_host=$HOST
        --db_user=$POSTGRES_USER
        --db_password=$POSTGRES_PASSWORD
        --addons-path=/usr/lib/python3/dist-packages/odoo/addons,.
        -i payment_taler
        --test-enable
        --test-tags taler
        --stop-after-init
        --without-demo=all
        --log-level=test

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
