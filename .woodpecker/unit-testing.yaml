when:
  - event: [push, pull_request]

steps:
  unit-tests:
    image: odoo:18
    pull: true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      HOST: postgres
    commands:
      - >
        odoo 
        -d test_db
        --db_host=$HOST
        --db_user=$POSTGRES_USER
        --db_password=$POSTGRES_PASSWORD
        --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/woodpecker/src
        -i payment_taler
        --test-enable
        --test-tags taler
        --stop-after-init
        --without-demo=all
        --log-level=test

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
